name: CI Pipeline - Order API

on:
  push:
    branches:
      - develop
      - feature/ajout-login
      - feature/commande
  pull_request:
    branches:
      - develop
      - feature/ajout-login
      - feature/commande

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Build with Maven
        run: mvn clean install -DskipTests=false

      - name: Run Tests
        run: mvn test

      - name: Build Docker image
        run: docker build -t payetonkawa-order-api .

      - name: Save Docker image
        run: docker save payetonkawa-order-api > order-api.tar
