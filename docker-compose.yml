version: '3.8'

services:
  commande-api:
    build: .
    image: payetonkawa-commande-api
    container_name: commande-api
    ports:
      - "8082:8080"
    depends_on:
      - postgresdb
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/commandedb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq

  postgresdb:
    image: postgres:13
    container_name: commande-api-postgresdb
    environment:
      POSTGRES_DB: commandedb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - commandedb_data:/var/lib/postgresql/data
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: commande-api-rabbitmq
    ports:
      - "5675:5672"
      - "15675:15672"
    restart: unless-stopped

volumes:
  commandedb_data:
