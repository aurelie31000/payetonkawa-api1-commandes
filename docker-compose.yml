version: '3.8'

services:
  commande-api:
    build: .   # Dockerfile du service commande-api dans le même dossier
    image: payetonkawa-commande-api
    ports:
      - "8082:8080"
    depends_on:
      - postgresdb
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgresdb:5432/commandedb
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
  
  postgresdb:
    image: postgres:13
    environment:
      POSTGRES_DB: commandedb
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"     # port pour la communication avec RabbitMQ
      - "15672:15672"   # port pour le dashboard web
